<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Workshop HIMASIKOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">🎯 Workshop HIMASIKOM</div>
            <h1>Absensi Peserta</h1>
            <p>Silakan isi data Anda dengan lengkap</p>
        </div>

        <form id="absensiForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap *</label>
                <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required>
                <div class="error-message" id="namaError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="Contoh: budi@email.com" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="institusi">Asal Institusi / Perusahaan *</label>
                <input type="text" id="institusi" name="institusi" placeholder="Contoh: Universitas ABC atau PT XYZ" required>
                <div class="error-message" id="institusiError"></div>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori" required>
                    <option value="" disabled selected>-- Pilih kategori --</option>
                    <option value="NARASUMBER">Narasumber</option>
                    <option value="PANITIA">Panitia</option>
                    <option value="PESERTA">Peserta</option>
                    <option value="MEDIA PARTNER">Media Partner</option>
                </select>
                <div class="error-message" id="kategoriError"></div>
            </div>

            <div class="form-group">
                <label for="kesan">Kesan Mengikuti Workshop (opsional)</label>
                <textarea id="kesan" name="kesan" placeholder="Bagikan kesan Anda tentang workshop ini..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">DAFTAR MASUK</button>
        </form>

        <div class="footer">
            Data Anda akan tersimpan dan sertifikat akan dikirim ke email Anda
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <span class="success-icon">✓</span>
        <span id="successText">Berhasil! Sertifikat akan dikirim ke email Anda jam 13.00</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
